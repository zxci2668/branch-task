[package]
name = "branch-task-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "accesskit", "default_fonts"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = "z"
